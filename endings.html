<!DOCTYPE html>
<html>
<head>
  <title>解放エンディング</title>
  <link rel="stylesheet" href="styles.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body class="archive-body">

  <div class="archive">

    <div class="archive-header">
      <span class="stamp-mini">機密解除</span>
      <h1>CASE FILE ARCHIVE</h1>
      <p class="archive-sub">回収済みエンディング — CODE:2A</p>
    </div>

    <div class="grid">

      <div class="box locked" id="ending1">
        <span class="tab">FILE 01</span>
        <span class="lockline"></span>
        <span class="lockline"></span>
        <span class="status">未開封</span>
      </div>

      <div class="box locked" id="ending2">
        <span class="tab">FILE 02</span>
        <span class="lockline"></span>
        <span class="lockline"></span>
        <span class="status">未開封</span>
      </div>

      <div class="box locked" id="ending3">
        <span class="tab">FILE 03</span>
        <span class="lockline"></span>
        <span class="lockline"></span>
        <span class="status">未開封</span>
      </div>

      <div class="box locked" id="ending4">
        <span class="tab">FILE 04</span>
        <span class="lockline"></span>
        <span class="lockline"></span>
        <span class="status">未開封</span>
      </div>

      <div class="box locked" id="ending5">
        <span class="tab">FILE 05</span>
        <span class="lockline"></span>
        <span class="lockline"></span>
        <span class="status">未開封</span>
      </div>

      <div class="box locked" id="ending6">
        <span class="tab">FILE 06</span>
        <span class="lockline"></span>
        <span class="lockline"></span>
        <span class="status">未開封</span>
      </div>

    </div>
    
    <button id="back-home" type="button">
        RETURN TO BRIEFING
    </button>

    <div class="archive-progress">
      <span id="progress-text">RECOVERED: 0 / 6</span>
      <button id="reset-progress" type="button">RESET CASE FILES</button>
    </div>

  </div>

  <script src="main.js"></script>
</body>
</html>
